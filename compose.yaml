name: quantdesk
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantdesk
      POSTGRES_PASSWORD: quantdesk_local
      POSTGRES_DB: quantdesk
    ports:
      - '127.0.0.1:54325:5432'
    volumes:
      - quantdesk-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quantdesk -d quantdesk']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  quantdesk-data:
